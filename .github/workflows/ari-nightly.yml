name: Fork nightly
run-name: Fork nightly ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream nightly tag to build. Defaults to the newest."
        required: false
        type: string
      force:
        description: "Rebuild even when this nightly is already released."
        required: false
        default: false
        type: boolean

concurrency:
  group: fork-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  UPSTREAM: https://github.com/pingdotgg/t3code.git

jobs:
  sync:
    name: Rebase onto upstream nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      ref: ${{ steps.rebase.outputs.ref }}
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
    steps:
      - id: pick
        name: Pick the upstream nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          tag="${REQUESTED:-$(git ls-remote --tags --refs "$UPSTREAM" 'v*-nightly.*' | sed 's|.*refs/tags/||' | sort -V | tail -1)}"
          published="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo false)"
          if [[ "$published" == "true" && "$FORCE" != "true" ]]; then
            echo "Already released $tag."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pick.outputs.tag != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: rebase
        name: Rebase local changes onto the nightly
        if: steps.pick.outputs.tag != ''
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "$UPSTREAM" "refs/tags/$TAG:refs/upstream/$TAG"
          if ! git rebase "refs/upstream/$TAG"; then
            git rebase --abort
            echo "::error::The local changes on $GITHUB_REF_NAME conflict with upstream $TAG. Rebase the branch onto that tag by hand and push it, then run this workflow again."
            exit 1
          fi
          git push --force-with-lease origin "HEAD:$GITHUB_REF_NAME"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: config
        name: Read T3 Connect public config
        if: steps.pick.outputs.tag != ''
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "clerk_publishable_key=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(env_example CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(env_example RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  bundle:
    name: Build JS bundle
    needs: [sync]
    if: needs.sync.outputs.ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.sync.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.sync.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.sync.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.sync.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.sync.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Stage web asset manifest
        run: cp apps/server/dist/client/.vite/manifest.json apps/server/dist/client/vite-manifest.release.json

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [sync, bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      ref: ${{ needs.sync.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.sync.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.sync.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.sync.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.sync.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [sync, bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      ref: ${{ needs.sync.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.sync.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.sync.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.sync.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.sync.outputs.relay_url }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false

  release:
    name: Publish release
    needs: [sync, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.sync.outputs.version }}
      REF: ${{ needs.sync.outputs.ref }}
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-win-*
          merge-multiple: true
          path: release-assets

      - name: Name the Windows updater manifest
        run: |
          set -euo pipefail
          for manifest in release-assets/*-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done

      - name: Publish release
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release view "$TAG" --repo pingdotgg/t3code --json body --jq .body > notes.md ||
            echo "Upstream $TAG with local changes." > notes.md

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            release-assets/*.exe release-assets/*.blockmap release-assets/*.yml \
            --target "$REF" \
            --prerelease \
            --latest=false \
            --title "T3 Code $TAG" \
            --notes-file notes.md

      - name: Point the update feed at this release
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "The desktop updater reads this release to find the newest nightly. Do not delete it."
          gh release upload update-feed nightly.json --clobber
          gh release edit update-feed --draft=false --prerelease --latest=false
